<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ISDM Companion</title>
<link rel="stylesheet" href="/styles.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📌</text></svg>">
</head>
<body>

<header class="topbar">
  <div class="brand">
    <span class="brand-mark"></span>
    <span class="brand-text">ISDM<em>Companion</em></span>
  </div>
  <div class="clock" id="clock">--:--</div>
  <nav class="tabs" role="tablist">
    <button class="tab is-active" data-view="today" role="tab">Today</button>
    <button class="tab" data-view="week" role="tab">Week</button>
  </nav>
</header>

<main id="main">
  <section id="view-today" class="view">
    <div class="autobar" id="autobar">
      <label class="switch">
        <input type="checkbox" id="auto-toggle">
        <span class="switch-track"><span class="switch-thumb"></span></span>
      </label>
      <div class="autobar-text">
        <div class="autobar-title" id="auto-title">Auto-mark off</div>
        <div class="autobar-sub" id="auto-sub">You'll be asked to tap Mark.</div>
      </div>
    </div>

    <div id="hero" class="hero hero--loading">
      <div class="hero-skeleton">Loading your day…</div>
    </div>

    <div class="daynav">
      <button class="daynav-btn" id="prev-day" title="Previous day">‹</button>
      <h2 class="daynav-label" id="day-label">Today</h2>
      <button class="daynav-btn" id="next-day" title="Next day">›</button>
      <button class="daynav-today" id="jump-today">Today</button>
    </div>

    <ol class="timeline" id="timeline"></ol>
  </section>

  <section id="view-week" class="view is-hidden">
    <div class="daynav">
      <button class="daynav-btn" id="prev-week" title="Previous week">‹</button>
      <h2 class="daynav-label" id="week-label">This week</h2>
      <button class="daynav-btn" id="next-week" title="Next week">›</button>
    </div>
    <div class="week" id="week"></div>
  </section>
</main>

<div class="toast-host" id="toast-host"></div>

<footer class="footer">
  <span id="status-line">—</span>
  <button class="linkish" id="enable-notifs">Enable browser alerts</button>
</footer>

<script src="/app.js" type="module"></script>
</body>
</html>
