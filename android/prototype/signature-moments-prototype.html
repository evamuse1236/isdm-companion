<!doctype html>
<!--
  PROTOTYPE — throwaway, do not ship.

  Single direction (evolved from winning variant A "Quiet ceremony"): ambient
  pastel atmosphere, editorial typography, living progress, ceremonies for the
  moments that matter. Variants B/C discarded per owner decision.

  Fully interactive: week strip + day switching, Schedule/Readings/Profile
  tabs, session & reading bottom sheets, issue-report sheet, mark ceremony,
  reading-done pop. Demo clock starts 11:12:30 and drives everything.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ISDM Companion — signature moments throwaway prototype</title>
<style>
  :root {
    color-scheme: light;
    --ink: #15201f;
    --ink2: #2c2630;
    --paper: #f4f8f7;
    --teal: #0d5f5c;
    --tealdeep: #073b3a;
    --muted: #65706d;
    --line: #dce5e2;
    --soft: #e4ece9;
    --green: #28755a;
    --blush: #e8bfdd;
    --blushaccent: #b45558;
    --blushshape: #bd82aa;
    --mint: #d8ebe3;
    --butter: #f4df9f;
    --butterink: #8a5b0e;
    --purple: #7151a1;
    --purplesoft: #f0eaf8;
    --spring: cubic-bezier(.34, 1.4, .48, 1);
    --ease: cubic-bezier(.2, 0, 0, 1);
    --err-c: #ffdad6;
    --on-err-c: #410002;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: #e8edeb; color: var(--ink);
    font: 15px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    display: flex; flex-direction: column; align-items: center;
    padding: 22px 12px 110px;
  }
  .proto-note { max-width: 660px; text-align: center; color: #4c5a55; font-size: 13px; margin-bottom: 14px; }
  .proto-note b { color: var(--ink); }
  .demo-log { margin-top: 10px; font-size: 12px; color: #4c5a55; font-variant-numeric: tabular-nums; }

  .phone { position: relative; width: min(400px, 100%); background: var(--paper); border: 1px solid #c9d6d1; border-radius: 36px; box-shadow: 0 24px 60px rgba(21,40,36,.18); overflow: hidden; }
  .screen { position: relative; height: 78vh; min-height: 660px; max-height: 860px; overflow-y: auto; overscroll-behavior: contain; }
  /* ambient wash */
  /* calm pass: ambient motion removed */
  .ambient { display: none; }
  .z { position: relative; z-index: 1; }

  .statusbar { display: flex; justify-content: space-between; padding: 10px 22px 2px; font-size: 12px; font-weight: 650; color: var(--muted); font-variant-numeric: tabular-nums; }

  /* ---------- header ---------- */
  .greetrow { display: flex; justify-content: space-between; align-items: center; padding: 14px 20px 2px; gap: 12px; }
  .eyebrow { font-size: 10px; font-weight: 800; letter-spacing: .14em; color: var(--muted); }
  .greetrow h1 { margin: 5px 0 0; font-size: 21px; line-height: 1.2; letter-spacing: -.02em; font-weight: 800; }
  .greetrow h1 em { font-style: normal; color: var(--teal); }
  .autopill {
    display: inline-flex; align-items: center; gap: 8px;
    margin: 0; background: transparent; border: none; border-radius: 999px;
    padding: 4px 0 4px 8px; cursor: pointer; flex: none;
    font: inherit; color: var(--ink); line-height: 1;
  }
  .autopill:active { transform: scale(.97); }
  .autopill:focus-visible { outline: 2px solid #006b5c; outline-offset: 3px; }
  .autopill .t { font-size: 12px; font-weight: 800; letter-spacing: .02em; }
  .m3switch {
    width: 52px; height: 32px; border-radius: 999px; flex: none;
    display: inline-block; vertical-align: middle;
    border: 2px solid #707973; background: var(--soft);
    position: relative; padding: 0; pointer-events: none;
    transition: background .25s var(--ease), border-color .25s var(--ease);
  }
  .m3switch i {
    position: absolute; top: 50%; left: 4px; width: 16px; height: 16px; margin-top: -8px;
    background: #707973; border-radius: 50%;
    display: grid; place-items: center; color: transparent;
    transition: left .25s var(--ease), width .25s var(--ease), height .25s var(--ease), margin-top .25s var(--ease), background .25s var(--ease), color .25s var(--ease);
  }
  .m3switch.on { background: #006b5c; border-color: #006b5c; }
  .m3switch.on i { left: 22px; width: 24px; height: 24px; margin-top: -12px; background: #fff; color: #006b5c; }
  .m3switch i svg { width: 13px; height: 13px; }
  .switch { width: 32px; height: 18px; border-radius: 999px; background: var(--soft); position: relative; border: none; padding: 0; flex: none; transition: background .25s; cursor: pointer; }
  .switch.on { background: var(--green); }
  .switch::after { content: ""; position: absolute; top: 2px; left: 2px; width: 14px; height: 14px; border-radius: 50%; background: #fff; box-shadow: 0 1px 4px rgba(0,0,0,.18); transition: transform .28s var(--spring); }
  .switch.on::after { transform: translateX(14px); }

  /* ---------- week strip ---------- */
  .weekstrip { display: grid; grid-template-columns: repeat(7, 1fr); gap: 5px; padding: 14px 16px 4px; }
  .day { border: none; background: transparent; border-radius: 15px; padding: 8px 0 7px; font: inherit; cursor: pointer; text-align: center; transition: background .25s, box-shadow .25s, transform .15s; position: relative; }
  .day:active { transform: scale(.94); }
  .day .dow { font-size: 9.5px; font-weight: 800; letter-spacing: .06em; color: var(--muted); display: block; }
  .day .num { font-size: 15px; font-weight: 800; margin-top: 3px; display: block; font-variant-numeric: tabular-nums; }
  .day.sel { background: var(--tealdeep); }
  .day.sel .dow, .day.sel .num { color: #fff; }
  .day.sel .ev i { background: rgba(255,255,255,.75); }
  .day.today:not(.sel) .num { color: var(--teal); }

  /* ---------- tabs (segmented, sliding) ---------- */
  .segtrack { margin: 14px 16px 2px; background: #e9f0ed; border-radius: 14px; padding: 2.5px; display: grid; grid-template-columns: repeat(3, 1fr); position: relative; }
  .segthumb { position: absolute; top: 2.5px; bottom: 2.5px; left: 2.5px; width: calc((100% - 5px) / 3); background: #fff; border-radius: 11px; transition: transform .38s var(--spring); box-shadow: 0 1px 4px rgba(21,32,31,.14); }
  .segtab { position: relative; z-index: 1; border: none; background: transparent; font: inherit; font-size: 13.5px; font-weight: 800; color: var(--muted); padding: 11px 0; border-radius: 11px; cursor: pointer; transition: color .25s; }
  .segtab.on { color: var(--ink); }

  /* ---------- schedule ---------- */
  .hero {
    position: relative; margin: 14px 16px 0; border-radius: 26px; overflow: hidden;
    background: var(--blush);
    color: var(--ink2);
  }
  .hero .blob { display: none; }
  .hero-inner { position: relative; padding: 18px 20px 20px; }
  .livenote { display: flex; align-items: center; gap: 7px; font-size: 10px; font-weight: 800; letter-spacing: .12em; color: var(--blushaccent); }
  .pulsedot { width: 8px; height: 8px; border-radius: 50%; background: var(--blushaccent); }
  .hero h2 { margin: 9px 0 0; font-size: 22px; line-height: 1.1; letter-spacing: -.015em; font-weight: 800; max-width: 82%; }
  .countline { margin-top: 10px; display: flex; align-items: baseline; gap: 9px; }
  .bigclock { font-size: 38px; line-height: 1; font-weight: 800; letter-spacing: -.03em; font-variant-numeric: tabular-nums; color: var(--ink2); }
  .untilsmall { font-size: 11px; font-weight: 800; color: var(--blushaccent); }
  .herometarow { display: flex; gap: 6px; margin-top: 12px; flex-wrap: wrap; }
  .metachip { font-size: 10px; font-weight: 800; background: rgba(255,255,255,.55); border-radius: 999px; padding: 5px 10px; }
  .trackedge { margin-top: 16px; height: 5px; border-radius: 999px; background: rgba(255,255,255,.5); overflow: hidden; position: relative; }
  .trackedge i { position: absolute; inset: 0 auto 0 0; border-radius: 999px; background: var(--blushaccent); }
  [data-ripple] { position: relative; overflow: hidden; }
  .rip { position: absolute; border-radius: 50%; pointer-events: none; background: currentColor; opacity: .13; transform: scale(0); animation: rip .55s var(--ease) forwards; }
  @keyframes rip { to { transform: scale(1); opacity: 0; } }
  .markA {
    margin-top: 16px; height: 40px; padding: 0 20px; border: none; border-radius: 999px; cursor: pointer;
    background: #006b5c; color: #fff; font: inherit;
    font-size: 13px; font-weight: 750; letter-spacing: .01em;
    display: inline-flex; align-items: center; gap: 8px;
    transition: background .25s, transform .15s;
  }
  .markA:active { transform: scale(.97); }
  .markA.busy { pointer-events: none; opacity: .92; }
  .markA.done { pointer-events: none; background: rgba(255,255,255,.82); color: #00201b; animation: settle .4s var(--ease); }
  @keyframes settle { 0% { transform: scale(.94); } 60% { transform: scale(1.02); } 100% { transform: scale(1); } }
  .markA svg { width: 15px; height: 15px; }
  .spinring { stroke: rgba(255,255,255,.85); stroke-dasharray: 38; stroke-dashoffset: 19; animation: spinit .8s linear infinite; }
  @keyframes spinit { to { stroke-dashoffset: -38; } }
  .checkpath { stroke: #fff; stroke-width: 2.6; fill: none; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 20; stroke-dashoffset: 20; }
  .markA .spinring { stroke: currentColor; fill: none; }
  .markA .checkpath { stroke: currentColor; stroke-width: 2.4; }
  .markA.done .checkpath { animation: drawcheck .3s ease-out forwards; }
  @keyframes drawcheck { to { stroke-dashoffset: 0; } }
  .markedstamp {
    margin-top: 14px; height: 32px; padding: 0 12px; border-radius: 999px;
    display: inline-flex; align-items: center; gap: 6px;
    background: rgba(255,255,255,.82); color: #00201b;
    font-size: 11.5px; font-weight: 800; white-space: nowrap;
    animation: settle .4s var(--ease);
  }
  .markedstamp svg { width: 14px; height: 14px; flex: none; }

  .sesscard {
    margin: 10px 16px 0; background: #fff; border-radius: 22px; padding: 15px 17px;
    display: flex; align-items: center; gap: 14px; cursor: pointer;
    border: 1px solid var(--line);
    transition: transform .18s var(--spring), box-shadow .25s;
  }
  .sesscard:active { transform: scale(.985); box-shadow: 0 2px 8px rgba(21,32,31,.07); }
  .sesscard.past { opacity: .55; }
  .sesscard .tt { font-size: 12px; font-weight: 800; color: var(--teal); font-variant-numeric: tabular-nums; width: 58px; flex: none; }
  .sesscard .mid { flex: 1; min-width: 0; }
  .sesscard .nm { font-size: 15px; font-weight: 800; letter-spacing: -.01em; }
  .sesscard .meta { font-size: 11px; color: var(--muted); margin-top: 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .statechip { font-size: 9.5px; font-weight: 800; letter-spacing: .04em; border-radius: 999px; padding: 5px 10px; flex: none; }
  .statechip.done { background: var(--mint); color: var(--green); }
  .statechip.next { background: var(--soft); color: var(--muted); }
  .chev-r { color: var(--muted); font-size: 14px; flex: none; }

  .armednote { margin: 14px 16px 0; display: flex; align-items: center; gap: 9px; background: var(--mint); color: var(--tealdeep); font-size: 11.5px; font-weight: 800; border-radius: 16px; padding: 12px 14px; }

  .emptyday { margin: 40px 30px 0; text-align: center; }
  .emptyart { position: relative; height: 84px; margin-bottom: 14px; }
  .emptyart i { position: absolute; top: 14px; border-radius: 50%; }
  .emptyart .e1 { width: 54px; height: 54px; left: calc(50% - 40px); background: var(--mint); opacity: .8; }
  .emptyart .e2 { width: 38px; height: 38px; left: calc(50% - 4px); background: var(--blush); opacity: .75; top: 30px; }
  .emptyart .e3 { width: 20px; height: 20px; left: calc(50% + 26px); background: var(--butter); top: 8px; }
  .emptyday b { font-size: 17px; letter-spacing: -.01em; }
  .emptyday p { color: var(--muted); font-size: 12.5px; margin: 6px 0 0; line-height: 1.55; }

  /* entrance */
  .rise { animation: rise .4s ease-out backwards; }
  @keyframes rise { from { opacity: 0; transform: translateY(8px); } }

  /* ---------- readings ---------- */
  .assesshead, .coursehead { position: relative; padding: 18px 18px 20px; cursor: pointer; overflow: hidden; }
  .assesscard, .coursecard { position: relative; margin: 14px 16px 0; border-radius: 26px; background: #fff; border: 1px solid rgba(220,229,226,.7); box-shadow: 0 6px 24px rgba(21,32,31,.06); overflow: hidden; }
  .assesshead { background: #ece4f5; }
  .coursehead { transition: filter .2s; }
  .coursehead:active { filter: brightness(.97); }
  .ch-inner { position: relative; max-width: 74%; }
  .ch-eyebrow { font-size: 9.5px; font-weight: 800; letter-spacing: .14em; }
  .ch-title { margin: 7px 0 0; font-size: 20px; line-height: 1.1; letter-spacing: -.015em; font-weight: 800; }
  .ch-meta { margin-top: 9px; font-size: 11.5px; color: rgba(21,32,31,.72); font-weight: 650; }
  .ch-meta b { font-weight: 800; }
  .ch-next { margin-top: 4px; font-size: 10.5px; color: rgba(21,32,31,.6); font-weight: 650; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .ch-right { position: absolute; right: 16px; top: 16px; display: flex; align-items: center; gap: 9px; z-index: 3; }
  .expandbtn {
    width: 40px; height: 40px; border: none; border-radius: 999px;
    background: rgba(255,255,255,.82); color: inherit; padding: 0;
    display: grid; place-items: center; cursor: pointer;
    box-shadow: 0 1px 2px rgba(21,32,31,.08);
    transition: background .2s, box-shadow .2s, transform .15s;
  }
  .expandbtn:hover { background: #fff; box-shadow: 0 2px 7px rgba(21,32,31,.12); }
  .expandbtn:active { transform: scale(.94); }
  .expandbtn svg { width: 20px; height: 20px; transition: transform .3s var(--ease); }
  .coursecard.open .expandbtn svg, .assesscard.open .expandbtn svg { transform: rotate(180deg); }
  .cardart {
    position: absolute; right: -4px; bottom: -6px; width: 104px; height: 82px;
    pointer-events: none;
    -webkit-mask-image: radial-gradient(130% 130% at 100% 100%, #000 52%, transparent 76%);
            mask-image: radial-gradient(130% 130% at 100% 100%, #000 52%, transparent 76%);
  }
  .cardbody { max-height: 0; overflow: hidden; transition: max-height .5s cubic-bezier(.3,.7,.3,1); }
  .cardbody.open { max-height: 720px; }
  #app { padding-bottom: 96px; }
  .bodyinner { padding: 2px 14px 14px; }
  .seclabel { padding: 13px 10px 5px; font-size: 10px; font-weight: 800; letter-spacing: .1em; color: var(--muted); }
  .facultyrow { display: flex; align-items: center; gap: 12px; padding: 9px 8px; border-radius: 16px; transition: background .2s; cursor: pointer; }
  .facultyrow:hover { background: var(--paper); }
  .avatar { width: 42px; height: 42px; border-radius: 50%; display: grid; place-items: center; font-size: 16px; font-weight: 800; flex: none; box-shadow: 0 4px 12px rgba(21,32,31,.12); }
  .facultyrow .who { flex: 1; min-width: 0; }
  .facultyrow .who b { font-size: 14px; display: block; letter-spacing: -.01em; }
  .facultyrow .who small { font-size: 10.5px; color: var(--muted); }
  .openico { width: 28px; height: 28px; border-radius: 50%; background: var(--paper); display: grid; place-items: center; color: var(--muted); font-size: 13px; flex: none; }
  .hr { height: 1px; background: var(--line); margin: 7px 6px; }
  .readrow { display: flex; align-items: center; gap: 12px; padding: 11px 8px; border-radius: 16px; margin: 2px 0; transition: background .35s; }
  .readrow.washed { background: var(--purplesoft); }
  .readrow .idx {
    width: 27px; height: 27px; border-radius: 10px;
    display: grid; place-items: center; flex: none;
    font-size: 10.5px; font-weight: 800; font-variant-numeric: tabular-nums;
  }
  .readrow .txt { flex: 1; min-width: 0; }
  .readrow .t { font-size: 14px; font-weight: 750; letter-spacing: -.01em; }
  .readrow .sub { font-size: 10.5px; color: var(--muted); margin-top: 3px; display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
  .pill { display: inline-block; font-size: 9px; font-weight: 800; border-radius: 999px; padding: 3px 8px; letter-spacing: .04em; }
  .pill.tag { background: #fff; border: 1px solid var(--line); color: var(--muted); font-weight: 750; }
  .pill.done { background: var(--purple); color: #fff; opacity: 0; transform: scale(.6); transition: all .3s cubic-bezier(.3,.7,.3,1.5) .1s; }
  .readrow.washed .pill.done { opacity: 1; transform: scale(1); }
  .cbx {
    width: 22px; height: 22px; border-radius: 6px; flex: none;
    border: 2px solid rgba(65,73,67,.66); background: transparent;
    display: grid; place-items: center; cursor: pointer; padding: 0;
    transition: all .2s var(--spring);
  }
  .cbx:hover { border-color: #006b5c; background: rgba(0,107,92,.08); }
  .cbx svg { width: 12px; height: 12px; }
  .cbx .tick { stroke: transparent; stroke-width: 2.8; fill: none; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 20; stroke-dashoffset: 20; }
  .cbx.on { background: #006b5c; border-color: #006b5c; animation: cbxpop .35s var(--spring); }
  .cbx.on .tick { stroke: #fff; animation: drawcheck .25s ease-out forwards; }
  @keyframes cbxpop { 0% { transform: scale(.82); } 55% { transform: scale(1.1); } 100% { transform: scale(1); } }
  .duechip { font-size: 9px; font-weight: 800; padding: 3px 8px; border-radius: 999px; }
  .duechip.warn { background: var(--butter); color: var(--butterink); }
  .duechip.ok { background: var(--mint); color: var(--green); }
  .minibtn { flex: none; border: none; border-radius: 12px; background: var(--paper); color: var(--ink); font: inherit; font-size: 11px; font-weight: 800; padding: 9px 13px; cursor: pointer; }
  .minibtn:active { transform: scale(.95); }
  .pdfbtn {
    height: 32px; padding: 0 14px; border: none; border-radius: 999px; flex: none;
    background: var(--mint); color: var(--tealdeep); font: inherit;
    font-size: 12px; font-weight: 750; cursor: pointer;
    display: inline-flex; align-items: center; gap: 7px;
    transition: background .2s, transform .15s;
  }
  .pdfbtn:hover { background: #cce8df; }
  .pdfbtn:active { transform: scale(.95); }
  .pdfbtn svg { width: 16px; height: 16px; flex: none; }
  .pdfbtn.ok-state { background: #9cf2de; color: #00201b; }

  /* ---------- profile ---------- */
  .profilehead { margin: 18px 20px 0; display: flex; align-items: center; gap: 14px; }
  .idavatar { width: 64px; height: 64px; border-radius: 50%; background: var(--tealdeep); color: #fff; display: grid; place-items: center; font-size: 21px; font-weight: 800; flex: none; }
  .profiletitle { min-width: 0; }
  .profiletitle > small { color: var(--muted); font-size: 10px; font-weight: 800; letter-spacing: .08em; }
  .profiletitle > b { display: block; margin-top: 2px; font-size: 22px; line-height: 1.15; letter-spacing: -.02em; }
  .profilechips { display: flex; gap: 6px; margin-top: 7px; }
  .profilechip { background: var(--mint); color: var(--tealdeep); border-radius: 999px; padding: 4px 9px; font-size: 9.5px; font-weight: 800; }
  .profilecard { margin: 14px 16px 0; background: #fff; border: 1px solid var(--line); border-radius: 24px; overflow: hidden; }
  .profilecard-inner { padding: 18px; }
  .profilecard-head { display: flex; align-items: flex-start; gap: 10px; }
  .profilecard-head .copy { flex: 1; min-width: 0; }
  .profilecard-head h3 { margin: 0; font-size: 18px; letter-spacing: -.015em; }
  .profilecard-head p { margin: 3px 0 0; color: var(--muted); font-size: 10.5px; }
  .lmschip { background: var(--mint); color: var(--green); border-radius: 999px; padding: 5px 9px; font-size: 9px; font-weight: 800; white-space: nowrap; }
  .attendance-main { display: flex; align-items: center; gap: 18px; margin-top: 18px; }
  .attendance-ring {
    --attendance: 84; width: 116px; height: 116px; border-radius: 50%; flex: none;
    display: grid; place-items: center; position: relative;
    background: conic-gradient(var(--teal) calc(var(--attendance) * 1%), var(--soft) 0);
  }
  .attendance-ring::before { content: ""; position: absolute; inset: 11px; border-radius: 50%; background: #fff; }
  .attendance-ring strong { position: relative; color: var(--tealdeep); font-size: 23px; line-height: 1; font-weight: 800; }
  .attendance-ring small { position: relative; display: block; margin-top: 3px; color: var(--muted); font-size: 9px; text-align: center; }
  .attendance-copy { flex: 1; min-width: 0; }
  .attendance-copy b { display: block; font-size: 18px; letter-spacing: -.015em; }
  .attendance-copy .absent { display: block; margin-top: 4px; color: var(--blushaccent); font-size: 13px; font-weight: 800; }
  .attendance-copy p { margin: 6px 0 0; color: var(--muted); font-size: 10.5px; line-height: 1.45; }
  .attstats { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 16px; }
  .attstat { border-radius: 14px; padding: 11px 10px; text-align: center; }
  .attstat b { display: block; font-size: 17px; }
  .attstat span { display: block; margin-top: 1px; font-size: 9.5px; font-weight: 800; }
  .attstat.present { background: var(--mint); color: var(--green); }
  .attstat.absent { background: rgba(232,191,221,.48); color: var(--blushaccent); }
  .attstat.unmarked { background: var(--butter); color: var(--ink); }
  .attstat.total { background: #d7f0ea; color: var(--tealdeep); }
  .material-text-action { width: 100%; margin-top: 10px; min-height: 38px; border: none; border-radius: 999px; background: transparent; color: var(--teal); font: inherit; font-size: 12px; font-weight: 800; cursor: pointer; }
  .material-text-action:hover { background: rgba(0,107,92,.08); }
  .material-text-action:active { transform: scale(.98); }
  .profile-setting { display: flex; align-items: center; gap: 12px; }
  .settingicon { width: 42px; height: 42px; border-radius: 14px; background: var(--mint); color: var(--teal); display: grid; place-items: center; font-size: 20px; font-weight: 800; flex: none; }
  .settingcopy { flex: 1; min-width: 0; }
  .settingcopy b { display: block; font-size: 15px; }

  var names = ["FRI", "SAT", "SUN", "MON", "TUE", "WED", "THU"];
  var nums = [21, 22, 23, 24, 25, 26, 27];
  return '<div class="weekstrip rise" style="animation-delay:.05s">' + names.map(function(d, i) {
    return '<button class="day' + (i === DAY_SEL ? " sel" : "") + (i === 0 ? " today" : "") + '" data-day="' + i + '">' +
      '<span class="dow">' + d + '</span><span class="num">' + nums[i] + '</span>' +
      '</button>';
  }).join("") + '</div>';
}
function segHtml() {
  function t(id, label, i) { return '<button class="segtab' + (ACTIVE_TAB === id ? " on" : "") + '" data-action="tab" data-tab="' + id + '">' + label + '</button>'; }
  var order = ["schedule", "readings", "profile"];
  var shift = order.indexOf(ACTIVE_TAB) * 100;
  return '<div class="segtrack rise" style="animation-delay:.09s"><div class="segthumb" style="transform:translateX(' + shift + '%)"></div>' +
    t("schedule", "Schedule") + t("readings", "Readings") + t("profile", "Profile") + '</div>';
}

/* ================= schedule ================= */
function heroHtml() {
  var s = TODAY_SESSIONS[1], now = nowMin();
  var pct = Math.max(0, Math.min(1, (now - s.start) / (s.end - s.start)));
  var remain = Math.max(0, s.end - now);
  var mm = Math.floor(remain), ss = Math.round((remain - mm) * 60);
  var clockHtml = pad(mm) + '<span class="colon">:</span>' + pad(ss === 60 ? 0 : ss);
  var cta = MARKED[s.id]
    ? '<span class="markedstamp">' + MARK_SVG_STAMP + '<span>Marked \u00b7 ' + MARKED[s.id] + '</span></span>'
    : '<button class="markA" data-mark="' + s.id + '" data-ripple><span>Mark attendance</span></button>';
  return '' +
  '<section class="hero rise" style="animation-delay:.14s" data-session="' + s.id + '">' +
    '<span class="blob b1"></span><span class="blob b2"></span>' +
    '<div class="hero-inner">' +
      '<div class="livenote"><span class="pulsedot"></span>HAPPENING NOW</div>' +
      '<h2>' + esc(s.name) + '</h2>' +
      '<div class="countline"><span class="bigclock" id="bigclock">' + clockHtml + '</span>' +
      '<span class="untilsmall">left \u00b7 until ' + fmt(s.end) + '</span></div>' +
      '<div class="herometarow"><span class="metachip">' + esc(s.room) + '</span><span class="metachip">Trainer ' + esc(s.trainer) + '</span><span class="metachip' + (INSIDE_ZONE ? "" : " gate-bad") + '">\u25ce ' + (INSIDE_ZONE ? "inside Campus Zone" : "outside Campus Zone") + '</span></div>' +
      '<div class="trackedge"><i id="edgefill" style="width:' + (pct * 100).toFixed(2) + '%"></i><u></u></div>' +
      cta +
    '</div>' +
  '</section>';
}
function sessCardHtml(s, opts) {
  opts = opts || {};
  var past = !!opts.past;
  var chip = past
    ? '<span class="statechip done">\u2713 DONE</span>'
    : '<span class="statechip next">' + fmt(s.start) + '</span>';
  return '' +
  '<section class="sesscard rise' + (past ? " past" : "") + '" style="animation-delay:' + (opts.delay || ".18s") + '" data-session="' + s.id + '">' +
    '<span class="tt">' + fmt(s.start) + '</span>' +
    '<div class="mid"><div class="nm">' + esc(s.name) + '</div>' +
    '<div class="meta">' + esc(s.room) + ' \u00b7 Trainer ' + esc(s.trainer) + '</div></div>' +
    chip + '<span class="chev-r">\u203a</span>' +
  '</section>';
}
function scheduleBody() {
  var out = "";
  if (DAY_SEL !== 0) {
    out += '<button class="backtoday" data-action="back-today">\u21a9 Back to today</button>';
  }
  if (DAY_SEL === 0) {
    var openAssessment = ASSESSMENTS.filter(function(a) { return !a.submitted && a.urgent; })[0];
    if (openAssessment) {
      out += '<div class="duebanner" data-action="goto-assessments">' + ASSIGN_ICON +
        '<span class="db-t">' + esc(openAssessment.title.split(" \u2014 ")[0]) + " \u00b7 " + esc(openAssessment.due) + '</span>' +
        '<span class="db-a">Submit</span></div>';
    }
  }
  if (DAY_SEL === 0) {
    var s1 = TODAY_SESSIONS[0], s3 = TODAY_SESSIONS[2];
    out += heroHtml();
    out += sessCardHtml(s1, { past: true, delay: ".2s" });
    if (MARKED.s2) out += sessCardHtml(TODAY_SESSIONS[1], { delay: ".24s" });
    out += sessCardHtml(s3, { delay: MARKED.s2 ? ".28s" : ".24s" });
    out += recapHtml();
    return out;
  }
  if (DAY_SEL === 1) {
    out += TOMORROW_SESSIONS.map(function(s, i) {
      return sessCardHtml(s, {}).replace('animation-delay:.18s', 'animation-delay:.' + (16 + i * 5) + 's');
    }).join("") +
    '<div class="armednote rise" style="animation-delay:.3s"><span class="pulsedot" style="background:var(--teal)"></span>Auto attendance armed \u00b7 first check 9:30 AM</div>';
    return out;
  }
  return out + '<div class="emptyday rise" style="animation-delay:.14s"><div class="emptyart"><i class="e1"></i><i class="e2"></i><i class="e3"></i></div>' +
    '<b>' + ["Saturday", "Sunday", "Monday", "Tuesday", "Wednesday", "Thursday"][DAY_SEL - 2] + ' is clear</b>' +
    '<p>Nothing scheduled. Your readings stay available offline \u2014 a good day to get ahead.</p></div>';
}

function recapHtml() {
  var states = TODAY_SESSIONS.map(function(s, i) {
    if (s.id === "s1") return "did";
    if (i === 1) return MARKED.s2 ? "did" : "now";
    return "";
  });
  var done = states.filter(function(x) { return x === "did"; }).length;
  var pendingNow = !MARKED.s2;
  var label = done + " of " + states.length + " marked" +
    (pendingNow ? " \u00b7 Public Finance waiting for your mark" : " \u00b7 all classes covered");
  return '<div class="recap" id="recap"><span class="eyebrow">TODAY\u2019S MARKS</span>' +
    '<span class="recdots">' + states.map(function(st) { return '<i class="recdot ' + st + '"></i>'; }).join("") + '</span>' +
    '<span class="rec-label">' + label + '</span></div>';
}

/* ================= readings ================= */

      '<div class="sub">' + esc(a.course) +

        '<h3 class="ch-title">' + (openCount === 0 ? "All submitted" : openCount + " assessment" + (openCount === 1 ? "" : "s") + " open") + '</h3>' +
        '<div class="ch-next">Next: ' + esc((ASSESSMENTS.filter(function(a) { return !a.submitted; })[0] || ASSESSMENTS[0]).title) + '</div>' +
      '</div>' +
      '<div class="ch-right"><button type="button" class="expandbtn" data-ripple aria-label="' + (ASSESS_OPEN ? "Collapse assessments" : "Expand assessments") + '" aria-expanded="' + ASSESS_OPEN + '" style="color:var(--purple)">' + EXPAND_ICON + '</button></div>' +
      '<svg class="cardart" viewBox="0 0 120 96"><circle cx="58" cy="88" r="38" fill="#bd82aa" opacity=".4"/><circle cx="108" cy="68" r="38" fill="#bd82aa" opacity=".4"/></svg>' +
    '</div>' +
    '<div class="cardbody' + (ASSESS_OPEN ? " open" : "") + '"><div class="bodyinner">' + assessRows + '</div></div>' +
  '</section>';

  var totalDone = 0, totalAll = 0;
  var courses = COURSES.map(function(c, ci) {
    var col = DESIGN[c.design % 4];
    var done = c.readings.filter(function(r) { return !!DONE[r.id]; }).length;
    totalDone += done; totalAll += c.readings.length;
    var open = !!EXPANDED[c.id];
    var fac = c.faculty.map(function(f) {
      return '<div class="facultyrow"><div class="avatar" style="background:' + col.panel + ';color:' + col.accent + '">' + esc((f.name[0] || "F").toUpperCase()) + '</div>' +
        '<div class="who"><b>' + esc(f.name) + '</b><small>' + esc(f.role || "Open LMS faculty profile") + '</small></div>' +
        '<span class="openico">\u2197</span></div>';
    }).join("");
    var reads = c.readings.map(function(r, ri) { return readRowHtml(r, c, ri); }).join("");
    var caughtUp = done === c.readings.length && c.readings.length > 0;
    return '' +
    '<section class="coursecard' + (open ? " open" : "") + ' rise" style="animation-delay:.' + (18 + ci * 5) + 's">' +
      '<div class="coursehead" style="background:' + col.panel + '" data-course="' + c.id + '">' +
        '<div class="ch-inner">' +
          '<div class="ch-eyebrow" style="color:' + col.accent + '">COURSE</div>' +
          '<h3 class="ch-title">' + esc(c.name) + '</h3>' +
          '<div class="ch-meta">' + (caughtUp
            ? '<b style="color:var(--green)">\u2713 All caught up</b>'
            : '<b>' + (c.readings.length - done) + ' to read</b>' + (done ? ' \u00b7 ' + done + ' done' : '')) +
            ' \u00b7 ' + c.faculty.length + ' faculty</div>' +
          '<div class="ch-next">' + (caughtUp
            ? "You\u2019re ready for the next session"
            : "Next: " + esc((c.readings.filter(function(r) { return !DONE[r.id]; })[0] || { title: "" }).title)) + '</div>' +
        '</div>' +
        '<div class="ch-right"><button type="button" class="expandbtn" data-ripple aria-label="' + (open ? "Collapse " : "Expand ") + esc(c.name) + '" aria-expanded="' + open + '" style="color:' + col.accent + '">' + EXPAND_ICON + '</button></div>' +
        artwork(c.design) +
      '</div>' +
      '<div class="cardbody' + (open ? " open" : "") + '"><div class="bodyinner">' +
        '<div class="seclabel">FACULTY PROFILE' + (c.faculty.length === 1 ? "" : "S") + '</div>' + fac + '<div class="hr"></div>' +
        '<div class="seclabel">PREPARE FOR NEXT SESSION</div>' + reads +
      '</div></div>' +
    '</section>';
  }).join("");

  var summary = '<div class="rise" style="animation-delay:.1s;margin:16px 22px 0;display:flex;justify-content:space-between;align-items:baseline">' +
    '<span class="eyebrow">THIS WEEK\u2019S PREP</span>' +
    '<span style="font-size:12px;font-weight:800;color:var(--teal)">' + totalDone + ' of ' + totalAll + ' read</span></div>';

  return summary + assess + courses;
}

      return '<span class="attachthumb"><button data-action="detach-image" data-n="' + n + '">\u2715</button></span>';

  return '<div class="sheet-backdrop" data-action="sheet-close"></div><div class="sheet">' + inner + '</div>';
}

var liveTickers = [];

  liveTickers.forEach(function(fn) { try { fn(); } catch (err) {} });

function renderApp() {
  liveTickers = [];
  var app = document.getElementById("app");
  var body = ACTIVE_TAB === "schedule" ? scheduleBody()
           : ACTIVE_TAB === "readings" ? readingsBody()
           : profileBody();
  app.innerHTML = headerHtml() + weekHtml() + segHtml() + body;
  document.getElementById("overlay").innerHTML = overlayHtml();

  if (ACTIVE_TAB === "schedule" && DAY_SEL === 0) {
    liveTickers.push(function() {
      var f = document.getElementById("edgefill");
      if (f) f.style.width = (Math.max(0, Math.min(1, (nowMin() - TODAY_SESSIONS[1].start) / (TODAY_SESSIONS[1].end - TODAY_SESSIONS[1].start))) * 100).toFixed(2) + "%";
      var bc = document.getElementById("bigclock");
      if (bc) {
        var rem = Math.max(0, TODAY_SESSIONS[1].end - nowMin());
        var mm = Math.floor(rem), ss = Math.min(59, Math.round((rem - mm) * 60));
        bc.innerHTML = pad(mm) + '<span class="colon">:</span>' + pad(ss);
      }
    });
  }
  var sb = document.getElementById("sbtime");
  if (sb) sb.textContent = fmt(nowMin());
}

function rerenderOverlayPreservingText() {
  var ta = document.querySelector(".issuebox");
  var val = ta ? ta.value : "";
  document.getElementById("overlay").innerHTML = overlayHtml();
  var ta2 = document.querySelector(".issuebox");
  if (ta2 && val) ta2.value = val;
}

document.addEventListener("click", function(e) {
  var el = e.target.closest("[data-action],[data-done],[data-day],[data-mark],[data-session],[data-course],[data-assess],[data-assess-id],[data-cat]");
  if (!el) return;

  if (el.hasAttribute("data-cat")) {
    document.querySelectorAll("[data-cat]").forEach(function(x) { x.classList.toggle("on", x === el); });
    return;
  }
  if (el.hasAttribute("data-done")) {
    var rid = el.getAttribute("data-done");
    DONE[rid] = !DONE[rid];
    note((DONE[rid] ? "done: " : "undone: ") + rid);
    var rowEl = el.closest(".readrow");
    if (rowEl) {
      rowEl.classList.toggle("washed", DONE[rid]);
      el.classList.toggle("on", DONE[rid]);
    }
    if (el.hasAttribute("data-fromsheet")) {
      el.className = "abtn full " + (DONE[rid] ? "soft" : "teal");
      el.textContent = DONE[rid] ? "Undo Done" : "Mark Done";
    }
    setTimeout(renderApp, 750); // refresh rings, recap, caught-up states after the pop settles
    return;
  }
  var daySel = el.getAttribute("data-day");
  if (daySel != null) {
    DAY_SEL = parseInt(daySel, 10);
    renderApp();
    return;
  }
  if (el.hasAttribute("data-mark")) {
    e.stopPropagation();
    runMarkCeremony(el);
    return;
  }

  var action = el.getAttribute("data-action");

  if (action === "tab") { ACTIVE_TAB = el.getAttribute("data-tab"); renderApp(); return; }
  if (action === "back-today") { DAY_SEL = 0; renderApp(); return; }
  if (action === "goto-assessments") {
    ACTIVE_TAB = "readings"; ASSESS_OPEN = true;
    SHEET = null; renderApp();
    note("jumped to assessments");
    return;
  }
  if (action === "toggle-auto") {
    if (AUTO_ON) { SHEET = { type: "autooff" }; renderApp(); }
    else { AUTO_ON = true; note("auto attendance armed \u00b7 Campus Zone checks on"); renderApp(); }
    return;
  }
  if (action === "auto-keep") { SHEET = null; renderApp(); note("auto attendance stayed on"); return; }
  if (action === "auto-off-confirm") { AUTO_ON = false; SHEET = null; renderApp(); note("auto attendance turned off"); return; }
  if (action === "signout") { SHEET = { type: "signout" }; renderApp(); return; }
  if (action === "signout-confirm") { SHEET = null; renderApp(); note("signed out \u00b7 LMS session removed"); return; }
  if (action === "grant-perm") {
    el.textContent = "Waiting\u2026";
    el.disabled = true;
    var permRow = SETUP_ROWS.filter(function(r) { return r.id === el.getAttribute("data-id"); })[0];
    setTimeout(function() {
      if (permRow) permRow.ok = true;
      renderApp();
      note((permRow ? permRow.label : "permission").toLowerCase() + " allowed");
    }, 900);
    return;
  }
  if (action === "submit-assessment") {
    var subSpan = el.querySelector("span");
    subSpan.textContent = "Opening authenticated LMS\u2026";
    el.style.pointerEvents = "none";
    var aid = el.getAttribute("data-id");
    setTimeout(function() {
      var a = ASSESSMENTS.find(function(x) { return x.id === aid; });
      if (a) a.submitted = true;
      SHEET = null; renderApp();
      note(a ? a.title.split(" \u2014 ")[0] + " synced as submitted" : "assessment synced as submitted");
    }, 1000);
    return;
  }
  if (action === "open-lms") {
    var lmsLabel = el.querySelector("span");
    if (lmsLabel.dataset.busy) return;
    lmsLabel.dataset.busy = "1";
    var lmsOriginal = lmsLabel.textContent;
    lmsLabel.textContent = "Opening\u2026";
    el.style.pointerEvents = "none";
    setTimeout(function() {
      delete lmsLabel.dataset.busy;
      lmsLabel.textContent = lmsOriginal;
      el.style.pointerEvents = "";
      note("handed off to " + (el.getAttribute("data-handoff") || "LMS"));
    }, 900);
    return;
  }
  if (action === "download") {
    var dlLabel = el.querySelector("span");
    if (!dlLabel || dlLabel.dataset.busy) return;
    dlLabel.dataset.busy = "1";
    var dlOriginal = dlLabel.textContent;
    dlLabel.textContent = "Saving\u2026";
    setTimeout(function() {
      dlLabel.textContent = "\u2713 Saved offline";
      el.classList.add("ok-state");
      note("saved for offline reading");
      setTimeout(function() {
        delete dlLabel.dataset.busy;
        dlLabel.textContent = dlOriginal;
        el.classList.remove("ok-state");
      }, 1500);
    }, 850);
    return;
  }
  if (action === "refresh-attendance") {
    if (el.disabled) return;
    el.disabled = true;
    el.textContent = "Updating…";
    setTimeout(function() {
      ATTENDANCE.updated = "Updated just now";
      renderApp();
      note("attendance updated from LMS");
    }, 900);
    return;
  }
  if (action === "profile-action") {
    note((el.getAttribute("data-label") || "profile action").toLowerCase());
    return;
  }
  if (action === "attach-image") { ISSUE_IMGS.push(ISSUE_IMGS.length ? ISSUE_IMGS[ISSUE_IMGS.length - 1] + 1 : 1); rerenderOverlayPreservingText(); return; }
  if (action === "detach-image") {
    var n = parseInt(el.getAttribute("data-n"), 10);
    ISSUE_IMGS = ISSUE_IMGS.filter(function(x) { return x !== n; });
    rerenderOverlayPreservingText();
    return;
  }
  if (action === "issue-send") {
    SHEET = { type: "issue-sent" }; renderApp();
    note("issue report sent");
    setTimeout(function() { if (SHEET && SHEET.type === "issue-sent") { SHEET = null; renderApp(); } }, 2200);
    return;
  }
  if (action === "sheet-close") { SHEET = null; renderApp(); return; }
  if (action === "issue-open") { SHEET = { type: "issue" }; ISSUE_IMGS = []; renderApp(); return; }
  if (action === "noop") { return; }

  var assessEl = e.target.closest("[data-assess-id]");
  if (assessEl && !e.target.closest("[data-action='download']")) {
    var aidOpen = assessEl.getAttribute("data-assess-id");
    var assessment = ASSESSMENTS.find(function(x) { return x.id === aidOpen; });
    if (assessment) { SHEET = { type: "assessment", assessment: assessment }; renderApp(); }
    return;
  }
  var sessEl = e.target.closest("[data-session]");
  if (sessEl && !e.target.closest(".markA")) {
    if (SHEET && SHEET.type !== "lecture") return;
    var sid = sessEl.getAttribute("data-session");
    var pool = DAY_SEL === 0 ? TODAY_SESSIONS : TOMORROW_SESSIONS;
    var found = pool.find(function(x) { return x.id === sid; });
    if (found) { SHEET = { type: "lecture", session: found }; renderApp(); }
    return;
  }
  var courseEl = e.target.closest("[data-course]");
  if (courseEl && !e.target.closest("[data-done]")) {
    var cid = courseEl.getAttribute("data-course");
    EXPANDED[cid] = !EXPANDED[cid];
    var cardEl = courseEl.closest(".coursecard");
    cardEl.classList.toggle("open", !!EXPANDED[cid]);
    cardEl.querySelector(".cardbody").classList.toggle("open", !!EXPANDED[cid]);
    var courseExpandBtn = cardEl.querySelector(".expandbtn");
    courseExpandBtn.setAttribute("aria-expanded", String(!!EXPANDED[cid]));
    courseExpandBtn.setAttribute("aria-label", (EXPANDED[cid] ? "Collapse " : "Expand ") + cardEl.querySelector(".ch-title").textContent);
    return;
  }
  if (e.target.closest("[data-assess]") && !e.target.closest("[data-done],[data-assess-id]")) {
    ASSESS_OPEN = !ASSESS_OPEN;
    var ac = e.target.closest(".assesscard");
    ac.classList.toggle("open", ASSESS_OPEN);
    ac.querySelector(".cardbody").classList.toggle("open", ASSESS_OPEN);
    var assessExpandBtn = ac.querySelector(".expandbtn");
    assessExpandBtn.setAttribute("aria-expanded", String(ASSESS_OPEN));
    assessExpandBtn.setAttribute("aria-label", ASSESS_OPEN ? "Collapse assessments" : "Expand assessments");
  }
});

/* ripples */
document.addEventListener("pointerdown", function(e) {
  var host = e.target.closest("[data-ripple]");
  if (!host) return;
  var rect = host.getBoundingClientRect();
  var size = Math.max(rect.width, rect.height) * 2.2;
  var span = document.createElement("span");
  span.className = "rip";
  span.style.width = size + "px";
  span.style.height = size + "px";
  span.style.left = (e.clientX - rect.left - size / 2) + "px";
  span.style.top = (e.clientY - rect.top - size / 2) + "px";
  host.appendChild(span);
  setTimeout(function() { span.remove(); }, 600);
});

renderApp();

/* demo location-evidence control (drives the gate failure path) */
var locInBtn = document.getElementById("locIn");
var locOutBtn = document.getElementById("locOut");
function paintLoc() {
  locInBtn.className = INSIDE_ZONE ? "on-in" : "";
  locOutBtn.className = INSIDE_ZONE ? "" : "on-out";
}
locInBtn.addEventListener("click", function() {
  INSIDE_ZONE = true; paintLoc(); renderApp();
  note("demo \u00b7 location evidence: inside Campus Zone");
});
locOutBtn.addEventListener("click", function() {
  INSIDE_ZONE = false; paintLoc(); renderApp();
  note("demo \u00b7 outside zone \u2014 try marking to see the blocked path");
});
paintLoc();
</script>
